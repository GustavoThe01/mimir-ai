name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      # O conjunto de fine-tuning é gerado por script. Se alguém editar os .jsonl à mão, ou mudar o script sem
      # regerar os arquivos, o CI acusa: os arquivos do repositório precisam ser exatamente o que o script produz.
      - name: Conjunto de fine-tuning reproduzível
        run: |
          python3 training/dados/gerar_chamados.py
          git diff --exit-code -- datasets/chamados
